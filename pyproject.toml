[project]
name = "automated-marketing"
version = "0.1.0"
description = "Lightweight prototype for PDF context ingestion and structured marketing collateral generation."
authors = []
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "google-genai>=1.32.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pdfplumber>=0.11.4,<0.12.0",
    "python-multipart>=0.0.9,<0.1.0",
    "pydantic-settings>=2.9.0,<3.0.0",
    "streamlit>=1.39.0,<2.0.0",
    "uvicorn[standard]>=0.30.6,<0.31.0",
    "pydantic (>=2.9.0,<3.0.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "prometheus-client (>=0.21,<1.0)",
    "pypdf (>=6.17.0,<7.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
]

[tool.poetry]
packages = [{ include = "marketing_collateral", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.2"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
